<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Путь к Корану</title>
  <meta name="description" content="Ежедневные занятия: чтение Корана, таджвид, заучивание сур, намаз, дуа и основы ислама.">
  <meta name="theme-color" content="#f6f1e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Путь к Корану">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script>
    // apply theme before first paint (no flash)
    try {
      var s = JSON.parse(localStorage.getItem('quran-path-v1') || '{}').settings || {};
      var t = s.theme && s.theme !== 'auto' ? s.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
      if (s.arScale) document.documentElement.style.setProperty('--ar-scale', s.arScale);
    } catch (e) { /* storage blocked */ }
  </script>
</head>
<body>
  <div id="app"><div id="view"><main class="page"><div class="skeleton" style="min-height:160px"></div></main></div></div>
  <noscript><p style="padding:16px">Для работы приложения включите JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
