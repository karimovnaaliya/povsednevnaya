<script>
(() => {
  const DURATION = 19.6;
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
  const easeInCubic = p => p * p * p;
  const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const easeOutBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  const easeOutBounce = p => {
    const n = 7.5625, d = 2.75;
    if (p < 1 / d) return n * p * p;
    if (p < 2 / d) return n * (p -= 1.5 / d) * p + .75;
    if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + .9375;
    return n * (p -= 2.625 / d) * p + .984375;
  };
  let seed = 17;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const set = (el, tr, op) => {
    if (tr !== undefined) el.setAttribute('transform', tr);
    if (op !== undefined) el.setAttribute('opacity', clamp(op).toFixed(3));
  };
  const mk = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e); return e;
  };

  // scene starts (slide-in begins)
  const S = [0, 1.6, 5.6, 9.8, 13.8];
  const PILLS = [null, 'Мама:', 'Подруга:', 'Коллега на Тайном Санте:', null];

  // ---------- bubbles ----------
  const BUBBLES = [
    { text: 'Ну зачем ты тратилась…', x: 540, y: 420, t0: 2.5, t1: 3.9, tail: 0.3, size: 66 },
    { text: '…но я её уже не сниму!', x: 540, y: 420, t0: 4.1, t1: 5.6, tail: 0.3, size: 66 },
    { text: 'А-А-А-А! Это мне?!', x: 540, y: 400, t0: 6.2, t1: 7.9, tail: 0.5, size: 82, shake: 1 },
    { text: 'Я тебя обожаю!!!', x: 540, y: 400, t0: 8.0, t1: 9.8, tail: 0.5, size: 76 },
    { text: 'Мне кружка…', x: 250, y: 760, t0: 10.3, t1: 13.8, tail: 0.25, size: 54 },
    { text: 'И мне кружка…', x: 830, y: 880, t0: 10.8, t1: 13.8, tail: 0.75, size: 54 },
    { text: 'А мне — Тёплый бокс.', x: 540, y: 420, t0: 11.5, t1: 13.8, tail: 0.5, size: 68 },
  ];
  BUBBLES.forEach(b => {
    b.g = mk('g', {}, $('bubbles'));
    b.path = mk('path', { fill: '#FFFDF9', stroke: '#4A3426', 'stroke-width': 5, 'stroke-linejoin': 'round' }, b.g);
    b.txt = mk('text', { class: 'hand', 'font-size': b.size, 'font-weight': 700, fill: '#4A3426', 'text-anchor': 'middle' }, b.g);
    b.txt.textContent = b.text;
  });
  const layout = () => {
    BUBBLES.forEach(b => {
      const w = b.txt.getComputedTextLength() + 80, h = b.size * 1.6;
      const x0 = b.x - w / 2, y0 = b.y - h / 2, r = 36, tx = x0 + w * b.tail;
      b.path.setAttribute('d', `M${x0 + r},${y0} H${x0 + w - r} a${r},${r} 0 0 1 ${r},${r} V${y0 + h - r} a${r},${r} 0 0 1 ${-r},${r} H${tx + 30} l-22,50 l-26,-50 H${x0 + r} a${r},${r} 0 0 1 ${-r},${-r} V${y0 + r} a${r},${r} 0 0 1 ${r},${-r} Z`);
      b.txt.setAttribute('x', b.x); b.txt.setAttribute('y', b.y + b.size * 0.32);
    });
    const tw = $('pillText');
  };

  // ---------- particles ----------
  const tears = [0, 1, 2, 3].map(k => ({ el: mk('ellipse', { rx: 9, ry: 13 }, $('tears')), side: k % 2 ? 1 : -1, ph: k * 0.37 }));
  const momHearts = [...Array(6)].map((_, k) => ({ el: mk('use', { href: '#heart' }, $('momHearts')), x: [-300, 300, -220, 250, -340, 330][k], d: 2.4 + k * 0.4 }));
  const rays = [...Array(12)].map((_, k) => mk('path', { d: `M0,0 L${Math.cos(k / 12 * 6.283 - 0.13) * 1400},${Math.sin(k / 12 * 6.283 - 0.13) * 1400} L${Math.cos(k / 12 * 6.283 + 0.13) * 1400},${Math.sin(k / 12 * 6.283 + 0.13) * 1400} Z` }, $('burst')));
  const sparks = [...Array(10)].map(() => ({ el: mk('use', { href: '#star4' }, $('sparkles')), x: 120 + rnd() * 840, y: 600 + rnd() * 900, ph: rnd() * 6.28 }));
  const cools = [...Array(6)].map((_, k) => ({ el: mk('use', { href: '#star4' }, $('cool')), x: 540 + [-170, 170, -120, 150, -60, 90][k], y: 1320 - 260 + [-60, -40, 40, 60, -110, 120][k], d: k * 0.07 }));

  function render(t) {
    // scene slides: each scene k visible from S[k] to S[k+1]+0.45
    const scenes = ['s0', 's1', 's2', 's3', 's4'];
    scenes.forEach((id, k) => {
      const inP = k === 0 ? 1 : easeInOut(seg(t, S[k], S[k] + 0.45));
      const outP = k + 1 < S.length ? easeInOut(seg(t, S[k + 1], S[k + 1] + 0.45)) : 0;
      const x = 1080 * (1 - inP) - 1080 * outP;
      let shake = '';
      if (id === 's2') { const sh = seg(t, 6.2, 7.6) > 0 && seg(t, 6.2, 7.6) < 1 ? 10 : 0; shake = ` translate(${(Math.sin(t * 70) * sh).toFixed(1)} ${(Math.cos(t * 53) * sh).toFixed(1)})`; }
      set($(id), `translate(${x.toFixed(1)} 0)${shake}`, (inP > 0 && outP < 1) ? 1 : 0);
    });

    // pill
    let pk = -1;
    for (let k = 1; k < 4; k++) if (t >= S[k] + 0.3 && t < S[k + 1]) pk = k;
    if (pk > 0) {
      const pt = $('pillText');
      if (pt.textContent !== PILLS[pk]) pt.textContent = PILLS[pk];
      const w = pt.getComputedTextLength() + 90;
      $('pillBg').setAttribute('x', 540 - w / 2); $('pillBg').setAttribute('width', w);
      const p = easeOutBack(seg(t, S[pk] + 0.3, S[pk] + 0.6));
      set($('pill'), `translate(540 210) scale(${(0.001 + p).toFixed(3)}) translate(-540 -210)`, 1);
    } else set($('pill'), undefined, 0);

    // bubbles
    BUBBLES.forEach(b => {
      const p = seg(t, b.t0, b.t0 + 0.3), o = seg(t, b.t1 - 0.2, b.t1);
      let tr = `translate(${b.x} ${b.y}) scale(${(0.001 + easeOutBack(p)).toFixed(3)}) translate(${-b.x} ${-b.y})`;
      if (b.shake && t < b.t1) tr = `translate(${(Math.sin(t * 60) * 5).toFixed(1)} ${(Math.cos(t * 47) * 5).toFixed(1)}) ` + tr;
      set(b.g, tr, p > 0 ? 1 - o : 0);
    });

    // --- scene 0 ---
    const b0 = easeOutBounce(seg(t, 0.15, 0.9));
    set($('s0box'), `translate(540 ${lerp(-300, 1240, b0).toFixed(1)}) rotate(${(Math.sin(t * 3) * 3).toFixed(2)}) scale(0.75)`);

    // --- scene 1: mom (origin 540,1320) ---
    set($('mom'), `translate(540 ${(1320 + Math.sin(t * 2.5) * 6).toFixed(1)})`);
    const lid = easeInCubic(seg(t, 2.1, 2.5));
    set($('momLid'), `translate(${540 + 300 * lid} ${1400 - 900 * lid}) rotate(${50 * lid}) scale(0.42)`, t < 2.45 ? 1 : 0);
    set($('momBox'), 'translate(0 80) scale(0.42)', t >= 2.3 ? 1 : 0);
    const cry = seg(t, 2.4, 2.6);
    tears.forEach(tr => {
      const ph = ((t * 1.4 + tr.ph) % 1);
      tr.el.setAttribute('cx', tr.side * (70 + ph * 25));
      tr.el.setAttribute('cy', (-235 + ph * 120).toFixed(1));
      tr.el.setAttribute('opacity', (cry * (1 - ph) * (t < 5.9 ? 1 : 0)).toFixed(3));
    });
    const hp = seg(t, 3.7, 4.1);
    set($('momHat'), `translate(0 ${lerp(30, -395, easeOutCubic(hp)) - 120 * Math.sin(Math.PI * hp)}) scale(${lerp(0.2, 0.85, easeOutBack(hp)).toFixed(3)})`, hp > 0 ? 1 : 0);
    momHearts.forEach((h, k) => {
      const p = ((t - h.d) / 2.2) % 1;
      const on = t > h.d && t < 6;
      set(h.el, `translate(${540 + h.x + Math.sin(p * 6 + k) * 15} ${1100 - 500 * p}) scale(${(1.1 + 0.4 * Math.sin(p * 3)).toFixed(2)})`, on ? Math.sin(Math.PI * p) : 0);
    });

    // --- scene 2: friend ---
    const jp = Math.max(0, t - 6.0);
    const hop = t > 6.0 ? Math.abs(Math.sin(Math.PI * jp / 0.45)) : 0;
    const squash = t > 6.0 ? 1 - 0.06 * (1 - hop) : 1;
    set($('friend'), `translate(540 ${(1360 - 110 * hop).toFixed(1)}) scale(${(2 - squash).toFixed(3)} ${squash.toFixed(3)})`);
    const ss = 1 + 0.2 * Math.sin(t * 12);
    set($('starL'), `translate(-40 -250) rotate(${t * 180 % 360}) scale(${(0.62 * ss).toFixed(3)})`);
    set($('starR'), `translate(40 -250) rotate(${-t * 180 % 360}) scale(${(0.62 * ss).toFixed(3)})`);
    $('scream').setAttribute('ry', (26 + 10 * Math.abs(Math.sin(t * 14))).toFixed(1));
    set($('burst'), `translate(540 1000) rotate(${(t * 20).toFixed(1)})`, 0.55 * seg(t, 6.1, 6.4));
    sparks.forEach(s => set(s.el, `translate(${s.x} ${s.y}) scale(${(0.6 + 0.6 * Math.abs(Math.sin(t * 4 + s.ph))).toFixed(3)}) rotate(${(t * 90 + s.ph * 50) % 360})`, t > 6.2 ? 1 : 0));

    // --- scene 3: colleague ---
    const look = easeInOut(seg(t, 11.5, 11.8));
    document.querySelectorAll('.jeal').forEach(g => g.setAttribute('transform', `translate(${(14 * look).toFixed(1)} ${(-4 * look).toFixed(1)})`));
    const sh = seg(t, 12.2, 12.6);
    set($('shades'), `translate(0 ${lerp(-500, 0, easeOutBounce(sh)).toFixed(1)})`, sh > 0 ? 1 : 0);
    cools.forEach(c => {
      const p = seg(t, 12.6 + c.d, 13.3 + c.d);
      set(c.el, `translate(${c.x} ${c.y}) scale(${(Math.sin(Math.PI * p) * 1.2).toFixed(3)}) rotate(${p * 90})`, p > 0 && p < 1 ? 1 : 0);
    });

    // --- scene 4 ---
    const b4 = easeOutBounce(seg(t, 14.1, 14.9));
    set($('s4box'), `translate(540 ${lerp(500, 1250, b4).toFixed(1)}) scale(0.85)`, t > 14.1 ? 1 : 0);
    const pp = seg(t, 14.9, 15.5);
    const pulse = t > 15.5 ? 1 + 0.04 * Math.sin((t - 15.5) * 6) : 1;
    set($('price'), `translate(860 960) rotate(${lerp(-40, -10, easeOutCubic(pp))}) scale(${(0.9 * easeOutBack(pp) * pulse).toFixed(3)})`, pp > 0 ? 1 : 0);

    // outro 16.2+
    set($('outroBg'), undefined, easeInOut(seg(t, 16.2, 16.8)));
    const lg = seg(t, 16.6, 17.4);
    set($('logo'), `translate(540 760) scale(${(0.001 + easeOutBack(lg)).toFixed(3)})`, lg > 0 ? 1 : 0);
    const tg = easeOutCubic(seg(t, 17.1, 17.6));
    set($('tagline'), `translate(0 ${lerp(30, 0, tg)})`, tg);
    const ct = easeOutCubic(seg(t, 17.4, 17.9));
    set($('cities'), `translate(0 ${lerp(30, 0, ct)})`, ct);
    const cta = seg(t, 17.7, 18.2);
    const ctaPulse = t > 18.2 ? 1 + 0.03 * Math.sin((t - 18.2) * 5) : 1;
    set($('cta'), `translate(540 1400) scale(${(0.001 + easeOutBack(cta) * ctaPulse).toFixed(3)}) translate(-540 -1400)`, cta > 0 ? 1 : 0);
  }

  window.DURATION = DURATION;
  window.renderAt = t => { if (!window.__laid) { layout(); window.__laid = 1; } render(t); };
  const params = new URLSearchParams(location.search);
  if (params.has('render')) return;
  document.body.classList.add('preview');
  document.fonts.ready.then(() => {
    if (params.has('t')) { window.renderAt(parseFloat(params.get('t'))); return; }
    let start = null;
    const loop = ts => { if (start === null) start = ts; window.renderAt(((ts - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
