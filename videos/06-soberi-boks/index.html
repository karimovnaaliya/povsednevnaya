  html, body { margin: 0; padding: 0; background: #1b1512; }

      <path d="M95,-120 C140,-40 40,10 70,110 L10,120 C-10,20 80,-40 35,-128 Z" fill="url(#knitLatte)" stroke="#C9B091" stroke-width="3"/>

        <path d="M-66,118 v32 M-52,120 v34 M-38,121 v30 M-24,122 v33 M-12,122 v28"/>

    <g id="gloves">

    <g id="sock">

    <g id="card">

    <g id="logoIcon" fill="none" stroke="#5A3E2B" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-62" y="-20" width="124" height="86" rx="4"/>
      <rect x="-72" y="-46" width="144" height="28" rx="4"/>
      <path d="M0,-46 V66"/>
      <path d="M0,-46 C-22,-86 -62,-78 -48,-56 C-40,-46 -16,-46 0,-46 Z"/>
      <path d="M0,-46 C22,-86 62,-78 48,-56 C40,-46 16,-46 0,-46 Z"/>
      <path d="M-40,10 L40,10" stroke-width="5" opacity="0.6"/>

  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#dots)" opacity="0.6"/>

  <!-- HUD -->
  <g id="hud">
    <rect x="190" y="140" width="700" height="100" rx="50" fill="#4A3426"/>
    <text x="540" y="207" text-anchor="middle" class="serif" font-size="52" font-weight="700" fill="#FBF6EE">Собираем тёплый бокс</text>
    <text id="meterText" x="540" y="318" text-anchor="middle" class="hand" font-size="58" font-weight="700" fill="#4A3426">Тепло: 0%</text>

  <!-- cards -->

  <!-- box: back (flap, inner rim) / flying items / front -->

  </g>
  <g id="flying"></g>
  <g id="boxFront">
    <rect x="-300" y="-180" width="600" height="370" rx="16" fill="#FFFDF9" stroke="#E2D6C6" stroke-width="4"/>
    <rect x="-224" y="-112" width="448" height="230" rx="12" fill="#F1E8DC" stroke="#E2D6C6" stroke-width="4"/>
    <g clip-path="url(#winClip)"><g id="stack"></g></g>
    <rect x="-224" y="-112" width="448" height="230" rx="12" fill="url(#windowGlass)"/>
    <circle cx="232" cy="150" r="42" fill="#F4ECE0" stroke="#5A3E2B" stroke-width="3"/>
    <text x="232" y="146" text-anchor="middle" class="serif" font-size="17" font-weight="700" fill="#5A3E2B">My Warm</text>
    <text x="232" y="166" text-anchor="middle" class="serif" font-size="17" font-weight="700" fill="#5A3E2B">Box</text>
    <g id="lid">
      <rect x="-26" y="-156" width="52" height="346" fill="#A63A32" opacity="0.92"/>
      <rect x="-316" y="-232" width="632" height="76" rx="14" fill="#FFFDF9" stroke="#E2D6C6" stroke-width="4"/>
      <rect x="-26" y="-232" width="52" height="76" fill="#A63A32"/>

      <path d="M0,0 C40,-80 150,-70 120,-16 C100,16 40,8 0,0 Z" fill="#B8463C" stroke="#8E2E28" stroke-width="4"/>
      <path d="M-6,4 L-60,80 L-38,82 L-30,96 L4,10 Z" fill="#A63A32"/>
      <path d="M6,4 L60,80 L38,82 L30,96 L-4,10 Z" fill="#A63A32"/>

  <g id="ripple" fill="none" stroke="#C2473D" stroke-width="6"><circle r="40"/></g>

  <g id="done" text-anchor="middle">
    <text x="540" y="640" class="serif" font-size="120" font-weight="700" fill="#4A3426">Бокс собран!</text>
    <text x="540" y="740" class="hand" font-size="70" font-weight="700" fill="#C2473D">тепло 100%</text>
  </g>
  <g id="headline" text-anchor="middle">
    <text x="540" y="560" class="serif" font-size="92" font-weight="700" fill="#4A3426">Тёплый бокс 5 в 1</text>
    <text x="540" y="650" class="hand" font-size="68" fill="#7A5A44">мы уже собрали его за вас</text>
  </g>
  <g id="price">
    <circle cx="0" cy="0" r="132" fill="#A63A32"/>
    <circle cx="0" cy="0" r="116" fill="none" stroke="#F4ECE2" stroke-width="3" stroke-dasharray="6 8"/>
    <text x="0" y="-44" text-anchor="middle" class="hand" font-size="50" fill="#F8EEE2">всего</text>
    <text x="0" y="22" text-anchor="middle" class="serif" font-size="74" font-weight="700" fill="#FFFDF9">1 699</text>
    <text x="0" y="74" text-anchor="middle" class="serif" font-size="42" font-weight="500" fill="#F8EEE2">сом</text>
  </g>
  <g id="confetti"></g>

  <!-- outro -->
  <rect id="outroBg" width="1080" height="1920" fill="#F4ECE2" opacity="0"/>
  <g id="outro">
    <g id="logo" transform="translate(540 760)">
      <circle r="250" fill="#F7F0E6" stroke="#5A3E2B" stroke-width="5"/>
      <use href="#logoIcon" transform="translate(0 -92) scale(0.9)"/>
      <text x="0" y="70" text-anchor="middle" class="serif" font-size="88" font-weight="700" fill="#5A3E2B">My Warm</text>
      <text x="0" y="160" text-anchor="middle" class="serif" font-size="88" font-weight="700" fill="#5A3E2B">Box</text>
    </g>
    <text id="tagline" x="540" y="1150" text-anchor="middle" class="hand" font-size="84" fill="#7A5A44">Подарок, который греет</text>
    <text id="cities" x="540" y="1265" text-anchor="middle" class="serif" font-size="50" font-weight="500" fill="#4A3426">Бишкек  •  Ош</text>
    <g id="cta">
      <rect x="190" y="1340" width="700" height="120" rx="60" fill="#A63A32"/>
      <text x="540" y="1418" text-anchor="middle" class="serif" font-size="48" font-weight="700" fill="#FFFDF9">Заказ в Direct / WhatsApp</text>
    </g>
  </g>
</svg>

<script>
(() => {
  const DURATION = 18;
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
  const easeInCubic = p => p * p * p;
  const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const easeOutBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  const easeOutBounce = p => {
    const n = 7.5625, d = 2.75;
    if (p < 1 / d) return n * p * p;
    if (p < 2 / d) return n * (p -= 1.5 / d) * p + .75;
    if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + .9375;
    return n * (p -= 2.625 / d) * p + .984375;
  };
  let seed = 9;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const set = (el, tr, op) => {
    if (tr !== undefined) el.setAttribute('transform', tr);
    if (op !== undefined) el.setAttribute('opacity', clamp(op).toFixed(3));
  };
  const mk = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e); return e;
  };

  const BOX0 = { x: 540, y: 1490, s: 0.95 }, BOX1 = { x: 540, y: 1250, s: 1.05 };
  const ITEMS = [
    { id: 'hatBody', label: 'шапка',    x: 210, y: 620, s: 0.62, mx: -175, ms: 0.33 },
    { id: 'scarf',   label: 'шарф',     x: 540, y: 620, s: 0.6,  mx: -88,  ms: 0.32 },
    { id: 'gloves',  label: 'перчатки', x: 870, y: 620, s: 0.55, mx: 0,    ms: 0.3 },
    { id: 'socks',   label: 'носки',    x: 375, y: 950, s: 0.6,  mx: 90,   ms: 0.32 },
    { id: 'card',    label: 'открытка', x: 705, y: 950, s: 0.55, mx: 178,  ms: 0.3 },
  ];
  ITEMS.forEach((it, i) => {
    it.T = 2.4 + i * 1.45;
    it.card = mk('g', {}, $('cards'));
    it.cardBg = mk('rect', { x: -140, y: -140, width: 280, height: 290, rx: 34, fill: '#FFFDF9', stroke: '#E2D6C6', 'stroke-width': 4, filter: 'url(#cardShadow)' }, it.card);
    it.icon = mk('use', { href: '#' + it.id }, it.card);
    const l = mk('text', { y: 125, 'text-anchor': 'middle', class: 'hand', 'font-size': 50, 'font-weight': 700, fill: '#4A3426' }, it.card);
    l.textContent = it.label;
    it.badge = mk('g', {}, it.card);
    mk('circle', { cx: 0, cy: 0, r: 34, fill: '#C2473D' }, it.badge);
    mk('path', { d: 'M-15,1 L-4,13 L16,-11', stroke: '#FFFDF9', 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, it.badge);
    it.fly = mk('use', { href: '#' + it.id }, $('flying'));
    it.mini = mk('use', { href: '#' + it.id }, $('stack'));
  });
  const COLORS = ['#C2473D', '#F2B65A', '#9AA89A', '#FBF6EE', '#8FB0D3', '#A63A32'];
  const conf = [...Array(70)].map((_, k) => ({
    el: mk('rect', { width: 16 + rnd() * 10, height: 9 + rnd() * 6, fill: COLORS[k % COLORS.length] }, $('confetti')),
    vx: lerp(-650, 650, rnd()), vy: lerp(-1700, -800, rnd()), rs: lerp(-720, 720, rnd()), d: rnd() * 0.25,
  }));

  const pointerPos = t => {
    let x = 1050, y = 1900;
    const enter = easeInOut(seg(t, 1.6, ITEMS[0].T - 0.05));
    const OY = -85;
    x = lerp(1050, ITEMS[0].x, enter); y = lerp(1900, ITEMS[0].y + OY, enter);
    for (let i = 1; i < ITEMS.length; i++) {
      const p = easeInOut(seg(t, ITEMS[i].T - 0.6, ITEMS[i].T - 0.05));
      if (p > 0) { x = lerp(ITEMS[i - 1].x, ITEMS[i].x, p); y = lerp(ITEMS[i - 1].y, ITEMS[i].y, p) + OY; }
    }
    const ex = easeInCubic(seg(t, 9.2, 9.8));
    return [lerp(x, 1150, ex), lerp(y, 1700, ex)];
  };

  function render(t) {
    // HUD
    const hd = easeOutBack(seg(t, 0.0, 0.6));
    set($('hud'), `translate(0 ${lerp(-300, 0, hd)})`, 1);
    let warm = 0;
    ITEMS.forEach(it => { warm += 0.2 * easeOutCubic(seg(t, it.T + 0.8, it.T + 1.2)); });
    $('meterBar').setAttribute('width', (772 * warm).toFixed(1));
    $('meterText').textContent = 'Тепло: ' + Math.round(warm * 100) + '%';
    const full = seg(t, 9.35, 9.6);
    $('meterText').setAttribute('transform', `translate(540 300) scale(${(1 + 0.25 * Math.sin(Math.PI * full)).toFixed(3)}) translate(-540 -300)`);

    // "+20%" floating label
    let plusOp = 0, plusY = 0, plusX = 540;
    ITEMS.forEach((it, i) => {
      const p = seg(t, it.T + 0.8, it.T + 1.5);
      if (p > 0 && p < 1) { plusOp = Math.sin(Math.PI * p); plusY = 450 - 50 * p; plusX = 154 + 772 * 0.2 * (i + 1) - 30; }
    });
    plusX = Math.min(plusX, 860);
    set($('plus'), `translate(${plusX.toFixed(1)} ${plusY.toFixed(1)})`, plusOp);

    // cards
    const cardsOut = seg(t, 9.4, 9.8);
    ITEMS.forEach((it, i) => {
      const ap = seg(t, 0.5 + i * 0.12, 0.85 + i * 0.12);
      const tap = seg(t, it.T - 0.05, it.T + 0.25);
      const press = 1 - 0.08 * Math.sin(Math.PI * tap);
      const picked = seg(t, it.T + 0.05, it.T + 0.3);
      set(it.card, `translate(${it.x} ${it.y}) scale(${(0.001 + easeOutBack(ap) * press * (1 - 0.3 * easeInCubic(cardsOut))).toFixed(3)})`, ap > 0 ? (1 - 0.45 * picked) * (1 - cardsOut) : 0);
      it.cardBg.setAttribute('stroke', tap > 0 && tap < 1 ? '#C2473D' : '#E2D6C6');
      set(it.icon, `translate(0 -20) scale(${it.s})`, 1 - picked);
      set(it.badge, `translate(110 -110) scale(${(0.001 + easeOutBack(seg(t, it.T + 0.8, it.T + 1.1))).toFixed(3)})`, t > it.T + 0.8 ? 1 : 0);
    });

    // box position
    const bm = easeInOut(seg(t, 10.6, 11.4));
    const rise = easeOutCubic(seg(t, 0.6, 1.3));
    const bx = lerp(BOX0.x, BOX1.x, bm), by = lerp(BOX0.y, BOX1.y, bm) + 700 * (1 - rise), bs = lerp(BOX0.s, BOX1.s, bm);
    const btr = `translate(${bx} ${by.toFixed(1)}) scale(${bs.toFixed(3)})`;
    set($('boxBack'), btr); set($('boxFront'), btr);
    set($('flying'), btr);

    // flying items in box coordinates (card -> opening -> drop)
    ITEMS.forEach(it => {
      const p = seg(t, it.T + 0.1, it.T + 0.7);
      const cx = (it.x - bx) / bs, cy = (it.y - 20 - by) / bs;
      const pe = easeInOut(p);
      const x = lerp(cx, 0, pe), y = lerp(cy, -230, pe) - 200 * Math.sin(Math.PI * p);
      const drop = seg(t, it.T + 0.7, it.T + 0.85);
      const sc = lerp(it.s / bs, it.ms * 1.3, pe);
      set(it.fly, `translate(${x.toFixed(1)} ${(y + 140 * drop).toFixed(1)}) rotate(${(Math.sin(p * Math.PI) * 20).toFixed(1)}) scale(${sc.toFixed(3)})`, p > 0 && drop < 1 ? 1 : 0);
      const md = seg(t, it.T + 0.78, it.T + 1.15);
      set(it.mini, `translate(${it.mx} ${lerp(-200, 25, easeOutBounce(md)).toFixed(1)}) scale(${it.ms})`, md > 0 ? 1 : 0);
    });

    // close lid + bow
    const lc = seg(t, 9.6, 9.95);
    set($('flap'), undefined, 1 - seg(t, 9.6, 9.75));
    set($('lid'), `translate(0 ${lerp(-260, 0, easeOutBounce(lc)).toFixed(1)})`, lc > 0 ? 1 : 0);
    const bw = seg(t, 10.0, 10.35);
    set($('bow'), `translate(0 -236) scale(${(0.001 + easeOutBack(bw)).toFixed(3)})`, bw > 0 ? 1 : 0);

    // pointer + ripple
    const [px, py] = pointerPos(t);
    let tapS = 1, rip = -1;
    ITEMS.forEach(it => { const p = seg(t, it.T - 0.05, it.T + 0.15); if (p > 0 && p < 1) tapS = 1 - 0.15 * Math.sin(Math.PI * p); const r = seg(t, it.T, it.T + 0.45); if (r > 0 && r < 1) rip = r; });
    set($('hand'), `translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(-14) scale(${tapS.toFixed(3)})`, t > 1.6 && t < 9.8 ? 1 : 0);
    set($('ripple'), `translate(${px.toFixed(1)} ${py.toFixed(1)}) scale(${(0.4 + 1.4 * rip).toFixed(3)})`, rip >= 0 ? 1 - rip : 0);

    // done + confetti
    const dn = seg(t, 9.5, 9.9), dnOut = seg(t, 11.0, 11.3);
    set($('done'), `translate(540 680) scale(${(0.001 + easeOutBack(dn)).toFixed(3)}) translate(-540 -680)`, dn > 0 ? 1 - dnOut : 0);
    const ct = t - 9.4;
    conf.forEach(c => {
      const tt = ct - c.d;
      if (tt <= 0 || tt > 3) { c.el.setAttribute('opacity', 0); return; }
      const x = 540 + c.vx * tt, y = 1300 + c.vy * tt + 0.5 * 1900 * tt * tt;
      c.el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(c.rs * tt).toFixed(1)})`);
      c.el.setAttribute('opacity', (1 - seg(tt, 2.2, 3)).toFixed(3));
    });

    // headline + price
    const hp = easeOutCubic(seg(t, 11.3, 11.9));
    set($('headline'), `translate(0 ${lerp(-40, 0, hp)})`, hp);
    const pp = seg(t, 12.0, 12.6);
    const pulse = t > 12.6 ? 1 + 0.04 * Math.sin((t - 12.6) * 6) : 1;
    set($('price'), `translate(870 940) rotate(${lerp(-40, -10, easeOutCubic(pp))}) scale(${(0.95 * easeOutBack(pp) * pulse).toFixed(3)})`, pp > 0 ? 1 : 0);

    // outro 14.0+
    set($('outroBg'), undefined, easeInOut(seg(t, 14.0, 14.6)));
    const lg = seg(t, 14.4, 15.2);
    set($('logo'), `translate(540 760) scale(${(0.001 + easeOutBack(lg)).toFixed(3)})`, lg > 0 ? 1 : 0);
    const tg = easeOutCubic(seg(t, 15.0, 15.6));
    set($('tagline'), `translate(0 ${lerp(30, 0, tg)})`, tg);
    const cy2 = easeOutCubic(seg(t, 15.4, 16.0));
    set($('cities'), `translate(0 ${lerp(30, 0, cy2)})`, cy2);
    const cta = seg(t, 15.8, 16.4);
    const ctaPulse = t > 16.4 ? 1 + 0.03 * Math.sin((t - 16.4) * 5) : 1;
    set($('cta'), `translate(540 1400) scale(${(0.001 + easeOutBack(cta) * ctaPulse).toFixed(3)}) translate(-540 -1400)`, cta > 0 ? 1 : 0);
  }

  window.DURATION = DURATION;
  window.renderAt = render;
  const params = new URLSearchParams(location.search);
  if (params.has('render')) return;
  document.body.classList.add('preview');
  document.fonts.ready.then(() => {
    if (params.has('t')) { render(parseFloat(params.get('t'))); return; }
    let start = null;
    const loop = ts => { if (start === null) start = ts; render(((ts - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
