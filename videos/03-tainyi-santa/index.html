<script>
(() => {
  const DURATION = 18;
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
  const easeInCubic = p => p * p * p;
  const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const easeOutBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  let seed = 5;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const set = (el, tr, op) => {
    if (tr !== undefined) el.setAttribute('transform', tr);
    if (op !== undefined) el.setAttribute('opacity', clamp(op).toFixed(3));
  };
  const mk = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e); return e;
  };

  // ---------- decor ----------
  for (let i = 0; i < 60; i++) mk('circle', { cx: rnd() * 1080, cy: 260 + rnd() * 1200, r: 2 + rnd() * 3 }, $('wallDots'));
  const BULB_COLORS = ['#F5C04A', '#E0574A', '#8FCB9B', '#F3E9D2'];
  const bulbs = [];
  const qpt = (p0, p1, p2, u) => (1 - u) * (1 - u) * p0 + 2 * (1 - u) * u * p1 + u * u * p2;
  for (let k = 0; k < 18; k++) {
    const half = k < 9 ? 0 : 1, u = ((k % 9) + 0.5) / 9;
    const x0 = half ? 540 : -20, x2 = half ? 1100 : 540, x1 = half ? 810 : 270;
    const x = qpt(x0, x1, x2, u), y = qpt(140, 270, 140, u);
    bulbs.push({ el: mk('ellipse', { cx: x, cy: y + 18, rx: 11, ry: 16, fill: BULB_COLORS[k % 4] }, $('garland')), ph: k * 1.3 });
  }
  const TL = [[-80, 900], [60, 990], [-120, 1080], [100, 1060], [-40, 1190], [150, 1270], [-170, 1290], [10, 1300], [-90, 1430], [80, 1440], [190, 1430], [-30, 1010]];
  TL.forEach(([x, y], k) => bulbs.push({ el: mk('circle', { cx: x, cy: y, r: 9, fill: BULB_COLORS[(k + 1) % 4] }, $('treeLights')), ph: k * 2.1 }));

  // ---------- chat bubbles ----------
  const MSGS = [
    { side: 'L', text: 'Жеребьёвка прошла!', t: 0.3, y: 590 },
    { side: 'L', text: 'Тебе выпала Айгуль из бухгалтерии', t: 0.9, y: 740 },
    { side: 'R', text: 'Мы даже не знакомы…', t: 1.6, y: 930 },
    { side: 'R', text: 'Что дарить?! Бюджет 2000 сом', t: 2.2, y: 1080 },
  ];
  MSGS.forEach(m => {
    const g = mk('g', {}, $('bubbles'));
    const r = mk('rect', { rx: 34, fill: m.side === 'L' ? '#FFFFFF' : '#A63A32' }, g);
    const tx = mk('text', { class: 'serif', 'font-size': 40, fill: m.side === 'L' ? '#2E2420' : '#FFFDF9' }, g);
    tx.textContent = m.text;
    m.g = g; m.r = r; m.tx = tx;
  });
  const layoutBubbles = () => MSGS.forEach(m => {
    const w = m.tx.getComputedTextLength() + 64;
    const x = m.side === 'L' ? 150 : 930 - w;
    m.r.setAttribute('x', x); m.r.setAttribute('y', m.y); m.r.setAttribute('width', w); m.r.setAttribute('height', 108);
    m.tx.setAttribute('x', x + 32); m.tx.setAttribute('y', m.y + 69);
    m.ox = m.side === 'L' ? x : x + w; m.oy = m.y + 108;
  });
  const QM = [[190, 330, '#F7EBDD', -14], [900, 300, '#F2C14E', 12], [140, 1560, '#F2C14E', 10], [930, 1540, '#F7EBDD', -10], [540, 250, '#E0574A', 0], [980, 900, '#E0574A', 16]];
  const qms = QM.map(([x, y, c, r], k) => { const e = mk('text', { 'font-size': 150, fill: c }, $('qmarks')); e.textContent = '?'; return { e, x, y, r, s0: 2.6 + k * 0.12 }; });

  // ---------- poof particles ----------
  const puffs = [...Array(10)].map((_, k) => ({ el: mk('circle', {}, $('poof')), a: k / 10 * Math.PI * 2, d: 120 + rnd() * 80, r: 30 + rnd() * 25 }));

  // ---------- checklist rows + flying items ----------
  const ITEMS = [
    { id: 'hatBody', label: 'шапка',    s: 0.26 },
    { id: 'scarf',   label: 'шарф',     s: 0.27 },
    { id: 'gloves',  label: 'перчатки', s: 0.24 },
    { id: 'socks',   label: 'носки',    s: 0.27 },
    { id: 'card',    label: 'открытка', s: 0.24 },
  ];
  const BOXP = { x: 330, y: 1610, s: 0.45 };
  ITEMS.forEach((it, i) => {
    it.y = 720 + i * 130; it.x = 640;
    it.s0 = 8.7 + i * 0.7; it.land = it.s0 + 0.6;
    it.lbl = mk('text', { x: 715, y: it.y + 20, class: 'hand', 'font-size': 62, 'font-weight': 700, fill: '#4A3426' }, $('rows'));
    it.lbl.textContent = it.label;
    it.chk = mk('path', { d: `M950,${it.y} l16,18 l32,-38`, stroke: '#A63A32', 'stroke-width': 10, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-dasharray': 80 }, $('rows'));
    it.g = mk('use', { href: '#' + it.id }, $('items'));
  });

  // ---------- render ----------
  function render(t) {
    bulbs.forEach(b => b.el.setAttribute('opacity', (0.55 + 0.45 * Math.sin(t * 3 + b.ph)).toFixed(3)));
    set($('star'), `translate(0 750) scale(${(1 + 0.06 * Math.sin(t * 4)).toFixed(3)}) rotate(${(Math.sin(t * 1.5) * 4).toFixed(2)})`);
    set($('treeGlow'), undefined, 0.8 + 0.2 * Math.sin(t * 2));

    // --- intro chat 0–3.9 ---
    const out = easeInCubic(seg(t, 3.4, 3.9));
    set($('scrim'), undefined, 0.6 * (1 - out));
    set($('phone'), `translate(0 ${1700 * out})`, 1 - seg(t, 3.75, 3.9));
    MSGS.forEach(m => {
      const p = seg(t, m.t, m.t + 0.35);
      const s = easeOutBack(p);
      set(m.g, `translate(${m.ox} ${m.oy}) scale(${(0.001 + s).toFixed(3)}) translate(${-m.ox} ${-m.oy})`, p > 0 ? 1 : 0);
    });
    qms.forEach((q, k) => {
      const p = seg(t, q.s0, q.s0 + 0.35), o = seg(t, 3.3, 3.6);
      const wob = Math.sin(t * 9 + k) * 6;
      set(q.e, `translate(${q.x} ${q.y}) rotate(${q.r + wob}) scale(${(0.001 + easeOutBack(p)).toFixed(3)})`, p > 0 ? 1 - o : 0);
    });

    // --- Santa sneaks in 3.9–5.8, places box 5.8–6.25, shh 6.25–6.95, poof 6.95–7.25 ---
    const walk = seg(t, 3.9, 5.8);
    const sx = lerp(1300, 700, walk);
    const stepPh = (t - 3.9) / 0.32;
    const walking = t > 3.9 && t < 5.8;
    const bob = walking ? -Math.abs(Math.sin(Math.PI * stepPh)) * 34 : 0;
    const lean = walking ? Math.sin(Math.PI * stepPh) * 4 : 0;
    const legA = walking ? Math.sin(Math.PI * stepPh) * 18 : 0;
    set($('legL'), `rotate(${legA} -37 100)`);
    set($('legR'), `rotate(${-legA} 37 100)`);
    const sy = 1415 + bob;
    const shhP = easeInOut(seg(t, 6.2, 6.45));
    set($('armR'), `rotate(${lerp(0, -150, shhP)} 122 -90)`);
    $('pupils').setAttribute('transform', `translate(${(walking ? Math.sin(t * 3) * 6 : lerp(-6, 0, shhP)).toFixed(1)} 0)`);
    const poofP = seg(t, 6.95, 7.25);
    const sScale = 1 - easeInCubic(poofP);
    set($('santa'), `translate(${sx.toFixed(1)} ${sy.toFixed(1)}) rotate(${lean - 30 * poofP}) scale(${(0.001 + sScale).toFixed(3)})`, t < 3.9 || t > 7.25 ? 0 : 1);
    set($('shh'), `translate(${sx - 380} ${1415 - 470}) scale(${(0.001 + easeOutBack(seg(t, 6.3, 6.55))).toFixed(3)})`, t > 6.3 && t < 6.95 ? 1 : 0);
    puffs.forEach(pf => {
      const p = easeOutCubic(poofP);
      pf.el.setAttribute('cx', (sx + Math.cos(pf.a) * pf.d * p).toFixed(1));
      pf.el.setAttribute('cy', (1300 + Math.sin(pf.a) * pf.d * p).toFixed(1));
      pf.el.setAttribute('r', (pf.r * (0.4 + p)).toFixed(1));
      pf.el.setAttribute('opacity', poofP > 0 ? (1 - seg(t, 7.15, 7.6)).toFixed(3) : 0);
    });

    // box: carried by Santa, then placed under the tree
    const place = easeInOut(seg(t, 5.8, 6.2));
    const carriedX = sx - 40, carriedY = sy + 40;
    const bx = lerp(carriedX, BOXP.x, place), by = lerp(carriedY, BOXP.y, place) - 120 * Math.sin(Math.PI * place);
    const bs = lerp(0.36, BOXP.s, place);
    set($('box'), `translate(${bx.toFixed(1)} ${by.toFixed(1)}) scale(${bs.toFixed(3)})`, t < 3.9 ? 0 : 1);
    // tag swing 7.3+
    const tp = seg(t, 7.3, 7.6), tagOut = seg(t, 8.0, 8.3);
    set($('tag'), `translate(500 1520) rotate(${(Math.sin((t - 7.3) * 7) * 14 * Math.exp(-(t - 7.3) * 2)).toFixed(2)} 0 -80) scale(${(0.001 + easeOutBack(tp)).toFixed(3)})`, tp > 0 ? 1 - tagOut : 0);
    // open
    const pull = easeInCubic(seg(t, 7.9, 8.15));
    set($('bow'), `translate(0 ${-236 - 60 * pull}) scale(${1 - pull})`, 1 - pull);
    set($('lidRibbon'), undefined, 1 - seg(t, 7.95, 8.2));
    const lo = easeInCubic(seg(t, 8.1, 8.55));
    set($('lid'), `translate(${-300 * lo} ${-900 * lo}) rotate(${-40 * lo})`, 1 - seg(t, 8.4, 8.55));

    // checklist
    const lp = seg(t, 8.2, 8.6);
    set($('list'), `translate(795 920) rotate(2) scale(${(0.001 + easeOutBack(lp)).toFixed(3)}) translate(-795 -920)`, lp > 0 ? 1 : 0);
    const boxTop = BOXP.y - 180 * BOXP.s;
    ITEMS.forEach((it, i) => {
      const p = seg(t, it.s0, it.land), pe = easeOutCubic(p);
      const x = lerp(BOXP.x, it.x, pe), y = lerp(boxTop, it.y, pe) - 280 * Math.sin(Math.PI * p);
      const sc = lerp(0.1, it.s, easeOutBack(p));
      set(it.g, `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${lerp(-40, 0, pe).toFixed(1)}) scale(${sc.toFixed(3)})`, p > 0 ? 1 : 0);
      const la = easeOutCubic(seg(t, it.land - 0.1, it.land + 0.25));
      set(it.lbl, `translate(${lerp(-20, 0, la)} 0)`, la);
      it.chk.setAttribute('stroke-dashoffset', (80 * (1 - easeOutCubic(seg(t, it.land + 0.05, it.land + 0.35)))).toFixed(1));
    });

    // headline + price
    const hp = easeOutCubic(seg(t, 12.0, 12.6));
    set($('headline'), `translate(0 ${lerp(-40, 0, hp)})`, hp);
    const pp = seg(t, 12.7, 13.3);
    const pulse = t > 13.3 ? 1 + 0.04 * Math.sin((t - 13.3) * 6) : 1;
    set($('price'), `translate(800 1520) rotate(${lerp(-40, -8, easeOutCubic(pp))}) scale(${(0.95 * easeOutBack(pp) * pulse).toFixed(3)})`, pp > 0 ? 1 : 0);
    const bg = easeOutCubic(seg(t, 13.1, 13.6));
    set($('budget'), `translate(0 ${lerp(25, 0, bg)})`, bg);

    // outro 14.4+
    set($('outroBg'), undefined, easeInOut(seg(t, 14.4, 15.0)));
    const lg = seg(t, 14.8, 15.6);
    set($('logo'), `translate(540 760) scale(${(0.001 + easeOutBack(lg)).toFixed(3)})`, lg > 0 ? 1 : 0);
    const tg = easeOutCubic(seg(t, 15.4, 16.0));
    set($('tagline'), `translate(0 ${lerp(30, 0, tg)})`, tg);
    const ct = easeOutCubic(seg(t, 15.8, 16.4));
    set($('cities'), `translate(0 ${lerp(30, 0, ct)})`, ct);
    const cta = seg(t, 16.2, 16.8);
    const ctaPulse = t > 16.8 ? 1 + 0.03 * Math.sin((t - 16.8) * 5) : 1;
    set($('cta'), `translate(540 1400) scale(${(0.001 + easeOutBack(cta) * ctaPulse).toFixed(3)}) translate(-540 -1400)`, cta > 0 ? 1 : 0);
  }

  window.DURATION = DURATION;
  window.renderAt = t => { if (!window.__laid) { layoutBubbles(); window.__laid = 1; } render(t); };
  const params = new URLSearchParams(location.search);
  if (params.has('render')) return;
  document.body.classList.add('preview');
  document.fonts.ready.then(() => {
    if (params.has('t')) { window.renderAt(parseFloat(params.get('t'))); return; }
    let start = null;
    const loop = ts => { if (start === null) start = ts; window.renderAt(((ts - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
