<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>My Warm Box — Распаковка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Caveat:wght@600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1b1512; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  #stage { width: 1080px; height: 1920px; display: block; }
  body.preview #stage { width: auto; height: 96vh; aspect-ratio: 9 / 16; }
  .serif { font-family: 'Lora', serif; }
  .hand { font-family: 'Caveat', cursive; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDB295"/>
      <stop offset="0.55" stop-color="#E6D6C2"/>
      <stop offset="1" stop-color="#F4ECE2"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFE7B0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFE7B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow">
      <stop offset="0" stop-color="#5A3E2B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5A3E2B" stop-opacity="0"/>
    </radialGradient>
    <!-- knit stitch patterns -->
    <pattern id="knitCream" width="26" height="22" patternUnits="userSpaceOnUse">
      <rect width="26" height="22" fill="#FBF6EE"/>
      <path d="M3 2 Q7 15 13 20 M23 2 Q19 15 13 20" stroke="#E3D5C1" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </pattern>
    <pattern id="knitLatte" width="26" height="22" patternUnits="userSpaceOnUse">
      <rect width="26" height="22" fill="#E9D8C1"/>
      <path d="M3 2 Q7 15 13 20 M23 2 Q19 15 13 20" stroke="#D2BB9E" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </pattern>
    <pattern id="ribCream" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#F3EADD"/>
      <path d="M8 0 V16" stroke="#DCCBB4" stroke-width="5"/>
    </pattern>
    <pattern id="ribLatte" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#E0CCB1"/>
      <path d="M8 0 V16" stroke="#C9B091" stroke-width="5"/>
    </pattern>
    <linearGradient id="windowGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- ===== ITEMS (each centred on 0,0, ~300px) ===== -->
    <g id="hat">
      <ellipse cx="0" cy="150" rx="140" ry="22" fill="url(#shadow)"/>
      <path d="M-118,70 C-122,-50 -70,-118 0,-118 C70,-118 122,-50 118,70 Z" fill="url(#knitCream)" stroke="#D8C8B2" stroke-width="3"/>
      <rect x="-136" y="40" width="272" height="80" rx="20" fill="url(#ribCream)" stroke="#D8C8B2" stroke-width="3"/>
      <circle cx="0" cy="-140" r="48" fill="#FFFDF8" stroke="#E2D4C0" stroke-width="6" stroke-dasharray="3 7" stroke-linecap="round"/>
      <circle cx="-12" cy="-152" r="14" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <g id="scarf">
      <ellipse cx="0" cy="160" rx="150" ry="22" fill="url(#shadow)"/>
      <path d="M-95,-120 C-140,-40 -40,10 -70,110 L-10,120 C10,20 -80,-40 -35,-128 Z" fill="url(#knitLatte)" stroke="#C9B091" stroke-width="3"/>
      <path d="M95,-120 C140,-40 40,10 70,110 L10,120 C-10,20 80,-40 35,-128 Z" fill="url(#knitLatte)" stroke="#C9B091" stroke-width="3"/>
      <path d="M-100,-128 Q0,-160 100,-128 L92,-82 Q0,-112 -92,-82 Z" fill="url(#knitLatte)" stroke="#C9B091" stroke-width="3"/>
      <rect x="-82" y="72" width="64" height="14" fill="#A63A32" opacity="0.85" transform="rotate(8 -50 80)"/>
      <rect x="18" y="72" width="64" height="14" fill="#A63A32" opacity="0.85" transform="rotate(-8 50 80)"/>
      <g stroke="#C9B091" stroke-width="5" stroke-linecap="round">
        <path d="M-66,118 v32 M-52,120 v34 M-38,121 v30 M-24,122 v33 M-12,122 v28"/>
        <path d="M66,118 v32 M52,120 v34 M38,121 v30 M24,122 v33 M12,122 v28"/>
      </g>
    </g>

    <g id="glove">
      <rect x="-58" y="58" width="116" height="62" rx="14" fill="url(#ribCream)" stroke="#D8C8B2" stroke-width="3"/>
      <rect x="-24" y="-150" width="28" height="104" rx="14" fill="url(#knitCream)" stroke="#D8C8B2" stroke-width="3"/>
      <rect x="6" y="-140" width="28" height="96" rx="14" fill="url(#knitCream)" stroke="#D8C8B2" stroke-width="3"/>
      <rect x="-54" y="-136" width="28" height="92" rx="14" fill="url(#knitCream)" stroke="#D8C8B2" stroke-width="3"/>
      <rect x="34" y="-116" width="26" height="76" rx="13" fill="url(#knitCream)" stroke="#D8C8B2" stroke-width="3"/>
      <rect x="-58" y="-60" width="118" height="126" rx="34" fill="url(#knitCream)" stroke="#D8C8B2" stroke-width="3"/>
      <rect x="-104" y="-40" width="30" height="88" rx="15" fill="url(#knitCream)" stroke="#D8C8B2" stroke-width="3" transform="rotate(-38 -60 20)"/>
    </g>
    <g id="gloves">
      <ellipse cx="0" cy="160" rx="160" ry="22" fill="url(#shadow)"/>
      <use href="#glove" transform="translate(-62 10) rotate(-12) scale(0.95)"/>
      <use href="#glove" transform="translate(62 10) rotate(12) scale(-0.95 0.95)"/>
    </g>

    <g id="sock">
      <path d="M-46,-120 L46,-120 L46,30 C46,62 66,74 100,76 C142,80 150,140 104,146 L-8,146 C-56,146 -52,96 -46,56 Z" fill="url(#knitLatte)" stroke="#C9B091" stroke-width="3"/>
      <rect x="-52" y="-150" width="104" height="54" rx="12" fill="url(#ribLatte)" stroke="#C9B091" stroke-width="3"/>
      <path d="M96,78 C140,82 150,140 104,146 L84,146 C110,130 112,96 90,80 Z" fill="#D8C2A6"/>
      <path d="M-46,100 C-52,140 -20,148 -4,146 L6,146 C-24,134 -30,112 -26,94 Z" fill="#D8C2A6"/>
    </g>
    <g id="socks">
      <ellipse cx="10" cy="168" rx="150" ry="22" fill="url(#shadow)"/>
      <use href="#sock" transform="translate(-50 0) rotate(-8) scale(0.85)"/>
      <use href="#sock" transform="translate(40 18) rotate(6) scale(0.85)"/>
    </g>

    <g id="card">
      <ellipse cx="0" cy="168" rx="130" ry="20" fill="url(#shadow)"/>
      <g transform="rotate(-6)">
        <rect x="-110" y="-140" width="220" height="290" rx="10" fill="#FFFDF9" stroke="#E2D6C6" stroke-width="3"/>
        <rect x="-110" y="-140" width="220" height="16" fill="#A63A32"/>
        <path d="M0,-28 C-30,-62 -72,-30 -40,6 L0,40 L40,6 C72,-30 30,-62 0,-28 Z" fill="#A63A32"/>
        <text x="0" y="98" text-anchor="middle" class="hand" font-size="46" fill="#5A3E2B">С любовью</text>
      </g>
    </g>

    <!-- logo mark: little gift box line icon -->
    <g id="logoIcon" fill="none" stroke="#5A3E2B" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-62" y="-20" width="124" height="86" rx="4"/>
      <rect x="-72" y="-46" width="144" height="28" rx="4"/>
      <path d="M0,-46 V66"/>
      <path d="M0,-46 C-22,-86 -62,-78 -48,-56 C-40,-46 -16,-46 0,-46 Z"/>
      <path d="M0,-46 C22,-86 62,-78 48,-56 C40,-46 16,-46 0,-46 Z"/>
      <path d="M-40,10 L40,10" stroke-width="5" opacity="0.6"/>
      <path d="M-40,34 L40,34" stroke-width="5" opacity="0.6"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <g id="glows"></g>
  <g id="snowBack"></g>

  <!-- intro title -->
  <g id="title" text-anchor="middle" class="serif" fill="#4A3426">
    <text x="540" y="820" font-size="104" font-weight="700">Не знаешь,</text>
    <text x="540" y="950" font-size="104" font-weight="700">что подарить?</text>
    <text x="540" y="1060" font-size="68" class="hand" fill="#7A5A44">мы уже всё собрали</text>
  </g>

  <!-- items (behind box so they emerge from it) -->
  <g id="items"></g>

  <!-- the box -->
  <g id="box">
    <ellipse cx="0" cy="205" rx="330" ry="34" fill="url(#shadow)"/>
    <rect x="-300" y="-180" width="600" height="370" rx="16" fill="#FFFDF9" stroke="#E2D6C6" stroke-width="4"/>
    <rect x="-224" y="-112" width="448" height="230" rx="12" fill="url(#knitCream)" stroke="#E2D6C6" stroke-width="4"/>
    <path d="M-224,30 C-120,-20 -40,60 60,10 C140,-30 200,20 224,0 L224,118 L-224,118 Z" fill="url(#knitLatte)" opacity="0.9"/>
    <rect x="-224" y="-112" width="448" height="230" rx="12" fill="url(#windowGlass)"/>
    <circle cx="232" cy="150" r="42" fill="#F4ECE0" stroke="#5A3E2B" stroke-width="3"/>
    <text x="232" y="146" text-anchor="middle" class="serif" font-size="17" font-weight="700" fill="#5A3E2B">My Warm</text>
    <text x="232" y="166" text-anchor="middle" class="serif" font-size="17" font-weight="700" fill="#5A3E2B">Box</text>
    <g id="lid">
      <rect x="-316" y="-232" width="632" height="76" rx="14" fill="#FFFDF9" stroke="#E2D6C6" stroke-width="4"/>
      <g id="lidRibbon">
        <rect x="-26" y="-232" width="52" height="76" fill="#A63A32"/>
        <rect x="-26" y="-156" width="52" height="346" fill="#A63A32" opacity="0.92"/>
      </g>
      <g id="bow" transform="translate(0 -236)">
        <path d="M0,0 C-40,-80 -150,-70 -120,-16 C-100,16 -40,8 0,0 Z" fill="#B8463C" stroke="#8E2E28" stroke-width="4"/>
        <path d="M0,0 C40,-80 150,-70 120,-16 C100,16 40,8 0,0 Z" fill="#B8463C" stroke="#8E2E28" stroke-width="4"/>
        <path d="M-6,4 L-60,80 L-38,82 L-30,96 L4,10 Z" fill="#A63A32"/>
        <path d="M6,4 L60,80 L38,82 L30,96 L-4,10 Z" fill="#A63A32"/>
        <circle cx="0" cy="0" r="22" fill="#A63A32" stroke="#8E2E28" stroke-width="4"/>
      </g>
    </g>
  </g>

  <!-- headline + price -->
  <g id="headline" text-anchor="middle" class="serif" fill="#4A3426">
    <text x="540" y="270" font-size="92" font-weight="700">Тёплый бокс 5 в 1</text>
  </g>
  <g id="price">
    <circle cx="0" cy="0" r="132" fill="#A63A32"/>
    <circle cx="0" cy="0" r="116" fill="none" stroke="#F4ECE2" stroke-width="3" stroke-dasharray="6 8"/>
    <text x="0" y="-44" text-anchor="middle" class="hand" font-size="50" fill="#F8EEE2">всего</text>
    <text x="0" y="22" text-anchor="middle" class="serif" font-size="74" font-weight="700" fill="#FFFDF9">1 699</text>
    <text x="0" y="74" text-anchor="middle" class="serif" font-size="42" font-weight="500" fill="#F8EEE2">сом</text>
  </g>

  <g id="snowFront"></g>

  <!-- outro -->
  <rect id="outroBg" width="1080" height="1920" fill="#F4ECE2"/>
  <g id="outro">
    <g id="logo" transform="translate(540 760)">
      <circle r="250" fill="#F7F0E6" stroke="#5A3E2B" stroke-width="5"/>
      <use href="#logoIcon" transform="translate(0 -92) scale(0.9)"/>
      <text x="0" y="70" text-anchor="middle" class="serif" font-size="88" font-weight="700" fill="#5A3E2B">My Warm</text>
      <text x="0" y="160" text-anchor="middle" class="serif" font-size="88" font-weight="700" fill="#5A3E2B">Box</text>
    </g>
    <text id="tagline" x="540" y="1150" text-anchor="middle" class="hand" font-size="84" fill="#7A5A44">Подарок, который греет</text>
    <text id="cities" x="540" y="1265" text-anchor="middle" class="serif" font-size="50" font-weight="500" fill="#4A3426">Бишкек  •  Ош</text>
    <g id="cta">
      <rect x="190" y="1340" width="700" height="120" rx="60" fill="#A63A32"/>
      <text x="540" y="1418" text-anchor="middle" class="serif" font-size="48" font-weight="700" fill="#FFFDF9">Заказ в Direct / WhatsApp</text>
    </g>
  </g>
</svg>

<script>
(() => {
  const DURATION = 17;
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);

  // ---------- easing helpers ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
  const easeInCubic = p => p * p * p;
  const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const easeOutBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  const easeOutBounce = p => {
    const n = 7.5625, d = 2.75;
    if (p < 1 / d) return n * p * p;
    if (p < 2 / d) return n * (p -= 1.5 / d) * p + .75;
    if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + .9375;
    return n * (p -= 2.625 / d) * p + .984375;
  };
  // deterministic random
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const set = (el, tr, op) => {
    if (tr !== undefined) el.setAttribute('transform', tr);
    if (op !== undefined) el.setAttribute('opacity', clamp(op).toFixed(3));
  };

  // ---------- build snow + glows ----------
  const flakes = [];
  const makeFlakes = (parent, n, rMin, rMax, op) => {
    for (let i = 0; i < n; i++) {
      const c = document.createElementNS(NS, 'circle');
      const f = { el: c, x: rnd() * 1080, y0: rnd() * 1920, r: lerp(rMin, rMax, rnd()),
                  speed: lerp(60, 150, rnd()), sway: lerp(10, 40, rnd()), ph: rnd() * 6.28 };
      f.speed *= f.r / rMax + 0.3;
      c.setAttribute('r', f.r.toFixed(1));
      c.setAttribute('fill', '#FFFFFF');
      c.setAttribute('opacity', op);
      parent.appendChild(c);
      flakes.push(f);
    }
  };
  makeFlakes($('snowBack'), 70, 3, 7, 0.75);
  makeFlakes($('snowFront'), 18, 7, 12, 0.9);

  const glows = [];
  for (let i = 0; i < 9; i++) {
    const c = document.createElementNS(NS, 'circle');
    const g = { el: c, x: rnd() * 1080, y: lerp(80, 900, rnd()), r: lerp(40, 110, rnd()), ph: rnd() * 6.28 };
    c.setAttribute('cx', g.x); c.setAttribute('cy', g.y); c.setAttribute('r', g.r);
    c.setAttribute('fill', 'url(#glow)');
    $('glows').appendChild(c);
    glows.push(g);
  }

  // ---------- items ----------
  const ITEMS = [
    { id: 'hat',    label: 'шапка',    x: 230, y: 560, rot: -6 },
    { id: 'scarf',  label: 'шарф',     x: 540, y: 500, rot: 3 },
    { id: 'gloves', label: 'перчатки', x: 850, y: 560, rot: 6 },
    { id: 'socks',  label: 'носки',    x: 330, y: 990, rot: -4 },
    { id: 'card',   label: 'открытка', x: 750, y: 990, rot: 5 },
  ];
  const ITEM_START = 5.0, ITEM_GAP = 1.0, ITEM_FLY = 0.9;
  ITEMS.forEach(it => {
    const g = document.createElementNS(NS, 'g');
    const u = document.createElementNS(NS, 'use');
    u.setAttribute('href', '#' + it.id);
    g.appendChild(u);
    const lbl = document.createElementNS(NS, 'text');
    lbl.textContent = it.label;
    lbl.setAttribute('class', 'hand');
    lbl.setAttribute('font-size', '64');
    lbl.setAttribute('font-weight', '700');
    lbl.setAttribute('fill', '#5A3E2B');
    lbl.setAttribute('text-anchor', 'middle');
    $('items').appendChild(g);
    $('items').appendChild(lbl);
    it.g = g; it.lbl = lbl;
  });

  // ---------- main render(t) ----------
  function render(t) {
    // glows twinkle
    glows.forEach(g => g.el.setAttribute('opacity', (0.35 + 0.3 * Math.sin(t * 1.6 + g.ph)).toFixed(3)));
    // snow
    flakes.forEach(f => {
      const y = ((f.y0 + f.speed * t) % 2000) - 40;
      const x = f.x + Math.sin(t * 0.9 + f.ph) * f.sway;
      f.el.setAttribute('cx', x.toFixed(1));
      f.el.setAttribute('cy', y.toFixed(1));
    });

    // title: in 0.2–1.0, out 2.0–2.4
    const tin = easeOutCubic(seg(t, 0.2, 1.0)), tout = seg(t, 2.0, 2.4);
    set($('title'), `translate(0 ${lerp(60, 0, tin) - 80 * easeInCubic(tout)})`, tin * (1 - tout));

    // box: drop 2.2–3.2, move down 4.3–5.0
    const drop = easeOutBounce(seg(t, 2.2, 3.2));
    const mv = easeInOut(seg(t, 4.3, 5.0));
    const bx = 540, by = lerp(lerp(-500, 1150, drop), 1500, mv), bs = lerp(1, 0.78, mv);
    set($('box'), `translate(${bx} ${by}) scale(${bs})`, t < 2.2 ? 0 : 1);

    // bow pull 3.2–3.8 (wiggle then shrink), lid off 3.8–4.5
    const wig = seg(t, 3.2, 3.55), pull = easeInCubic(seg(t, 3.5, 3.85));
    const wrot = Math.sin(wig * Math.PI * 4) * 8 * (1 - wig);
    set($('bow'), `translate(0 ${-236 - 60 * pull}) rotate(${wrot}) scale(${1 - pull})`, 1 - pull);
    set($('lidRibbon'), undefined, 1 - seg(t, 3.6, 3.9));
    const lo = easeInCubic(seg(t, 3.85, 4.5));
    set($('lid'), `translate(${380 * lo} ${-760 * lo}) rotate(${38 * lo})`, 1 - seg(t, 4.2, 4.5));

    // items fly out of the box
    const boxTopY = by - 180 * bs;
    ITEMS.forEach((it, i) => {
      const s0 = ITEM_START + i * ITEM_GAP;
      const p = seg(t, s0, s0 + ITEM_FLY);
      const pe = easeOutCubic(p);
      const bob = p >= 1 ? Math.sin((t - s0) * 2.4 + i) * 7 : 0;
      const x = lerp(bx, it.x, pe);
      const y = lerp(boxTopY, it.y, pe) - 220 * Math.sin(Math.PI * p) + bob;
      const sc = lerp(0.2, 0.95, easeOutBack(p));
      const rot = lerp(i % 2 ? 25 : -25, it.rot, pe);
      set(it.g, `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(2)}) scale(${sc.toFixed(3)})`, p > 0 ? clamp(p * 4) : 0);
      const lp = easeOutCubic(seg(t, s0 + ITEM_FLY * 0.7, s0 + ITEM_FLY + 0.3));
      it.lbl.setAttribute('x', it.x);
      it.lbl.setAttribute('y', (it.y + 205 + lerp(20, 0, lp) + bob).toFixed(1));
      it.lbl.setAttribute('opacity', lp.toFixed(3));
    });

    // headline 10.2–10.8, price 10.9–11.5
    const hp = easeOutCubic(seg(t, 10.2, 10.8));
    set($('headline'), `translate(0 ${lerp(-40, 0, hp)})`, hp);
    const pp = seg(t, 10.9, 11.5);
    const pulse = t > 11.5 ? 1 + 0.04 * Math.sin((t - 11.5) * 6) : 1;
    set($('price'), `translate(870 1440) rotate(${lerp(-40, -10, easeOutCubic(pp))}) scale(${(easeOutBack(pp) * pulse).toFixed(3)})`, pp > 0 ? 1 : 0);

    // outro 13.0+
    set($('outroBg'), undefined, easeInOut(seg(t, 13.0, 13.6)));
    const lg = seg(t, 13.4, 14.2);
    set($('logo'), `translate(540 760) scale(${(0.001 + easeOutBack(lg)).toFixed(3)})`, lg > 0 ? 1 : 0);
    const tg = easeOutCubic(seg(t, 14.0, 14.6));
    set($('tagline'), `translate(0 ${lerp(30, 0, tg)})`, tg);
    const ct = easeOutCubic(seg(t, 14.4, 15.0));
    set($('cities'), `translate(0 ${lerp(30, 0, ct)})`, ct);
    const cta = seg(t, 14.8, 15.4);
    const ctaPulse = t > 15.4 ? 1 + 0.03 * Math.sin((t - 15.4) * 5) : 1;
    set($('cta'), `translate(540 1400) scale(${(easeOutBack(cta) * ctaPulse).toFixed(3)}) translate(-540 -1400)`, cta > 0 ? 1 : 0);
  }

  window.DURATION = DURATION;
  window.renderAt = render;

  // ---------- preview mode ----------
  const params = new URLSearchParams(location.search);
  if (params.has('render')) return;            // renderer drives frames
  document.body.classList.add('preview');
  if (params.has('t')) { render(parseFloat(params.get('t'))); return; }
  let start = null;
  document.fonts.ready.then(() => {
    const loop = ts => {
      if (start === null) start = ts;
      render(((ts - start) / 1000) % DURATION);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
