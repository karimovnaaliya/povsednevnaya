<script>
(() => {
  const DURATION = 18;
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
  const easeInCubic = p => p * p * p;
  const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const easeOutBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  const easeOutBounce = p => {
    const n = 7.5625, d = 2.75;
    if (p < 1 / d) return n * p * p;
    if (p < 2 / d) return n * (p -= 1.5 / d) * p + .75;
    if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + .9375;
    return n * (p -= 2.625 / d) * p + .984375;
  };
  const mixColor = (a, b, p) => {
    const ha = a.match(/\w\w/g).map(h => parseInt(h, 16)), hb = b.match(/\w\w/g).map(h => parseInt(h, 16));
    return '#' + ha.map((v, i) => Math.round(lerp(v, hb[i], p)).toString(16).padStart(2, '0')).join('');
  };
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const set = (el, tr, op) => {
    if (tr !== undefined) el.setAttribute('transform', tr);
    if (op !== undefined) el.setAttribute('opacity', clamp(op).toFixed(3));
  };

  // ---------- items: fly from box to the hero ----------
  const HERO = { x: 540, y: 1150 };
  const BOX = { x: 830, y: 1560, s: 0.6 };
  const ITEM_START = 5.0, ITEM_GAP = 1.0, ITEM_FLY = 0.9;
  const ITEMS = [
    { id: 'hatBody', label: '+ шапка',    tx: 540, ty: 800,  ts: 0.82, worn: 'wornHat',    lx: 840, ly: 760 },
    { id: 'scarf',   label: '+ шарф',     tx: 540, ty: 1030, ts: 0.55, worn: 'wornScarf',  lx: 240, ly: 960 },
    { id: 'gloves',  label: '+ перчатки', tx: 540, ty: 1235, ts: 0.5,  worn: 'wornGloves', lx: 860, ly: 1130 },
    { id: 'socks',   label: '+ носки',    tx: 540, ty: 1450, ts: 0.45, worn: 'wornSocks',  lx: 250, ly: 1330 },
    { id: 'card',    label: '+ открытка', tx: 230, ty: 1500, ts: 0.6,  worn: null,         lx: 230, ly: 1330 },
  ];
  ITEMS.forEach((it, i) => {
    it.s0 = ITEM_START + i * ITEM_GAP;
    it.land = it.s0 + ITEM_FLY;
    const g = document.createElementNS(NS, 'use');
    g.setAttribute('href', '#' + it.id);
    $('items').appendChild(g);
    const l = document.createElementNS(NS, 'text');
    l.textContent = it.label;
    l.setAttribute('class', 'hand'); l.setAttribute('font-size', '66'); l.setAttribute('font-weight', '700');
    l.setAttribute('fill', '#4A3426'); l.setAttribute('text-anchor', 'middle');
    $('items').appendChild(l);
    it.g = g; it.l = l;
  });

  // warmth 0..1 : +0.2 per item worn
  const warmth = t => ITEMS.reduce((s, it) => s + 0.2 * easeInOut(seg(t, it.land - 0.1, it.land + 0.6)), 0);
  // cumulative coldness integral for snow/wind drift
  const DT = 1 / 120, COLD = [0];
  for (let k = 1; k <= DURATION / DT + 2; k++) COLD.push(COLD[k - 1] + (1 - warmth(k * DT)) * DT);
  const coldInt = t => COLD[Math.min(COLD.length - 1, Math.max(0, Math.round(t / DT)))];

  // ---------- snow, wind, glows ----------
  const flakes = [];
  const makeFlakes = (parent, n, rMin, rMax, op) => {
    for (let i = 0; i < n; i++) {
      const c = document.createElementNS(NS, 'circle');
      const r = lerp(rMin, rMax, rnd());
      flakes.push({ el: c, x: rnd() * 1300, y0: rnd() * 1960, r, k: r / rMax + 0.4, ph: rnd() * 6.28 });
      c.setAttribute('r', r.toFixed(1)); c.setAttribute('fill', '#FFFFFF'); c.setAttribute('opacity', op);
      parent.appendChild(c);
    }
  };
  makeFlakes($('snowBack'), 110, 3, 8, 0.85);
  makeFlakes($('snowFront'), 26, 8, 13, 0.9);

  const winds = [];
  for (let i = 0; i < 7; i++) {
    const p = document.createElementNS(NS, 'path');
    const w = { el: p, y: lerp(150, 1500, rnd()), len: lerp(160, 320, rnd()), sp: lerp(900, 1500, rnd()), off: rnd() * 2000 };
    p.setAttribute('d', `M0,0 q${w.len / 2},-24 ${w.len},0 q${w.len / 4},14 ${w.len / 2},-6`);
    $('wind').appendChild(p);
    winds.push(w);
  }
  const glows = [];
  for (let i = 0; i < 9; i++) {
    const c = document.createElementNS(NS, 'circle');
    const g = { el: c, ph: rnd() * 6.28 };
    c.setAttribute('cx', rnd() * 1080); c.setAttribute('cy', lerp(80, 1000, rnd())); c.setAttribute('r', lerp(50, 120, rnd()));
    c.setAttribute('fill', 'url(#glow)');
    $('glows').appendChild(c); glows.push(g);
  }
  const puffs = [0, 1, 2].map(() => { const c = document.createElementNS(NS, 'circle'); $('breath').appendChild(c); return c; });
  const HEART_X = [-210, 190, -120, 240, -260, 120, 0];
  const hearts = HEART_X.map(() => { const u = document.createElementNS(NS, 'use'); u.setAttribute('href', '#heart'); $('hearts').appendChild(u); return u; });

  // ---------- render ----------
  function render(t) {
    const w = warmth(t), cold = 1 - w, C = coldInt(t);

    set($('bgWarmRect'), undefined, w);
    set($('glows'), undefined, w);
    glows.forEach(g => g.el.setAttribute('opacity', (0.45 + 0.35 * Math.sin(t * 1.6 + g.ph)).toFixed(3)));
    flakes.forEach(f => {
      const fall = (60 * t + 260 * C) * f.k;
      const drift = -520 * C * f.k + Math.sin(t * 0.9 + f.ph) * 25;
      const y = ((f.y0 + fall) % 2000) - 40;
      const x = (((f.x + drift) % 1300) + 1300) % 1300 - 110;
      f.el.setAttribute('cx', x.toFixed(1)); f.el.setAttribute('cy', y.toFixed(1));
    });
    $('wind').setAttribute('opacity', (0.55 * cold * cold).toFixed(3));
    winds.forEach(wd => {
      const x = 1300 - ((wd.off + wd.sp * t) % 2000);
      wd.el.setAttribute('transform', `translate(${x.toFixed(1)} ${wd.y})`);
    });

    // hero shiver
    const amp = 8 * Math.pow(cold, 1.5);
    const jx = Math.sin(t * 57) * amp, jy = Math.sin(t * 43) * amp * 0.35;
    const breathe = Math.sin(t * 2.2) * 4 * w;
    set($('hero'), `translate(${(HERO.x + jx).toFixed(1)} ${(HERO.y + jy - breathe).toFixed(1)})`);
    $('cheekL').setAttribute('fill', mixColor('9FB8D6', 'F2A1A1', w));
    $('cheekR').setAttribute('fill', mixColor('9FB8D6', 'F2A1A1', w));
    set($('brows'), undefined, 1 - seg(w, 0.5, 0.9));
    set($('drip'), undefined, 1 - seg(w, 0.2, 0.5));
    const happy = easeInOut(seg(t, 10.1, 10.4));
    set($('mouthCold'), undefined, 1 - seg(w, 0.55, 0.8));
    set($('mouthWarm'), undefined, seg(w, 0.55, 0.8));
    const look = 10 * easeInOut(seg(t, 3.3, 3.7)) * (1 - easeInOut(seg(t, 9.8, 10.1)));
    set($('eyesOpen'), `translate(${look.toFixed(1)} 0)`, 1 - happy);
    set($('eyesHappy'), undefined, happy);

    // breath puffs (cold only)
    puffs.forEach((c, k) => {
      const ph = ((t * 0.8 + k / 3) % 1);
      c.setAttribute('cx', (HERO.x + jx + 40 + ph * 70).toFixed(1));
      c.setAttribute('cy', (HERO.y - 175 - ph * 110).toFixed(1));
      c.setAttribute('r', (8 + ph * 26).toFixed(1));
      c.setAttribute('opacity', ((1 - ph) * 0.75 * cold * cold).toFixed(3));
    });

    // titles
    const ci = easeOutCubic(seg(t, 0.2, 0.9)), co = seg(t, 2.8, 3.2);
    set($('titleCold'), `translate(0 ${lerp(50, 0, ci) - 60 * easeInCubic(co)})`, ci * (1 - co));
    const bi = seg(t, 0.9, 1.2), bo = seg(t, 2.6, 2.9);
    set($('brr'), `translate(${(830 + Math.sin(t * 40) * 6).toFixed(1)} 760) rotate(${8 + Math.sin(t * 31) * 4})`, bi * (1 - bo));

    // box flies in 3.2–4.0
    const fp = seg(t, 3.2, 4.0);
    const bx = lerp(1350, BOX.x, easeOutCubic(fp));
    const by = lerp(-300, BOX.y, easeOutBounce(fp));
    set($('box'), `translate(${bx.toFixed(1)} ${by.toFixed(1)}) rotate(${lerp(-35, 0, easeOutCubic(fp)).toFixed(2)}) scale(${BOX.s})`, t < 3.2 ? 0 : 1);
    const pi = easeOutBack(seg(t, 3.9, 4.25)), po = seg(t, 4.8, 5.1);
    set($('parcel'), `translate(830 1330) scale(${(0.001 + pi).toFixed(3)}) translate(-830 -1330)`, (t > 3.9 ? 1 : 0) * (1 - po));
    // open: bow 4.3–4.6, lid 4.55–5.0
    const pull = easeInCubic(seg(t, 4.3, 4.6));
    set($('bow'), `translate(0 ${-236 - 60 * pull}) scale(${1 - pull})`, 1 - pull);
    set($('lidRibbon'), undefined, 1 - seg(t, 4.4, 4.7));
    const lo = easeInCubic(seg(t, 4.55, 5.0));
    set($('lid'), `translate(${400 * lo} ${-900 * lo}) rotate(${40 * lo})`, 1 - seg(t, 4.85, 5.0));

    // items
    const boxTop = BOX.y - 180 * BOX.s;
    ITEMS.forEach((it, i) => {
      const p = seg(t, it.s0, it.land), pe = easeOutCubic(p);
      const x = lerp(BOX.x, it.tx, pe);
      const y = lerp(boxTop, it.ty, pe) - 260 * Math.sin(Math.PI * p);
      const sc = lerp(0.12, it.ts, easeOutBack(p));
      const rot = lerp(i % 2 ? 30 : -30, 0, pe);
      const swap = it.worn ? seg(t, it.land - 0.05, it.land + 0.2) : 0;
      let op = p > 0 ? clamp(p * 5) * (1 - swap) : 0;
      let tx = x, ty = y;
      if (!it.worn && p >= 1) ty += Math.sin((t - it.land) * 2.4) * 6;
      set(it.g, `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) rotate(${rot.toFixed(2)}) scale(${sc.toFixed(3)})`, op);
      if (it.worn) set($(it.worn), undefined, swap);
      const lp = easeOutCubic(seg(t, it.land - 0.1, it.land + 0.3)), lout = seg(t, it.land + 1.1, it.land + 1.4);
      const keep = it.worn ? 1 - lout : (1 - seg(t, 11.4, 11.7));
      it.l.setAttribute('x', it.lx);
      it.l.setAttribute('y', (it.ly + lerp(25, 0, lp)).toFixed(1));
      it.l.setAttribute('opacity', (lp * keep).toFixed(3));
    });

    // warm finale
    const wi = easeOutCubic(seg(t, 10.2, 10.8)), wo = seg(t, 11.3, 11.6);
    set($('titleWarm'), `translate(0 ${lerp(40, 0, wi)})`, wi * (1 - wo));
    hearts.forEach((h, k) => {
      const s0 = 10.2 + k * 0.32, p = seg(t, s0, s0 + 2.2);
      const x = HERO.x + HEART_X[k] + Math.sin(p * 6 + k) * 18;
      const y = HERO.y - 120 - 380 * easeOutCubic(p);
      set(h, `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(0.6 + 0.8 * easeOutBack(clamp(p * 3))).toFixed(3)})`, p > 0 && p < 1 ? Math.sin(Math.PI * p) : 0);
    });
    const hp = easeOutCubic(seg(t, 11.7, 12.3));
    set($('headline'), `translate(0 ${lerp(-40, 0, hp)})`, hp);
    const pp = seg(t, 12.3, 12.9);
    const pulse = t > 12.9 ? 1 + 0.04 * Math.sin((t - 12.9) * 6) : 1;
    set($('price'), `translate(880 1180) rotate(${lerp(-40, -10, easeOutCubic(pp))}) scale(${(0.9 * easeOutBack(pp) * pulse).toFixed(3)})`, pp > 0 ? 1 : 0);

    // outro 14.2+
    set($('outroBg'), undefined, easeInOut(seg(t, 14.2, 14.8)));
    const lg = seg(t, 14.6, 15.4);
    set($('logo'), `translate(540 760) scale(${(0.001 + easeOutBack(lg)).toFixed(3)})`, lg > 0 ? 1 : 0);
    const tg = easeOutCubic(seg(t, 15.2, 15.8));
    set($('tagline'), `translate(0 ${lerp(30, 0, tg)})`, tg);
    const ct = easeOutCubic(seg(t, 15.6, 16.2));
    set($('cities'), `translate(0 ${lerp(30, 0, ct)})`, ct);
    const cta = seg(t, 16.0, 16.6);
    const ctaPulse = t > 16.6 ? 1 + 0.03 * Math.sin((t - 16.6) * 5) : 1;
    set($('cta'), `translate(540 1400) scale(${(0.001 + easeOutBack(cta) * ctaPulse).toFixed(3)}) translate(-540 -1400)`, cta > 0 ? 1 : 0);
  }

  window.DURATION = DURATION;
  window.renderAt = render;
  const params = new URLSearchParams(location.search);
  if (params.has('render')) return;
  document.body.classList.add('preview');
  if (params.has('t')) { document.fonts.ready.then(() => render(parseFloat(params.get('t')))); return; }
  let start = null;
  document.fonts.ready.then(() => {
    const loop = ts => { if (start === null) start = ts; render(((ts - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
