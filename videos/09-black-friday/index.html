<script>
(() => {
  const DURATION = 16;
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
  const easeInCubic = p => p * p * p;
  const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const easeOutBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  const easeOutBounce = p => {
    const n = 7.5625, d = 2.75;
    if (p < 1 / d) return n * p * p;
    if (p < 2 / d) return n * (p -= 1.5 / d) * p + .75;
    if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + .9375;
    return n * (p -= 2.625 / d) * p + .984375;
  };
  let seed = 23;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const set = (el, tr, op) => {
    if (tr !== undefined) el.setAttribute('transform', tr);
    if (op !== undefined) el.setAttribute('opacity', clamp(op).toFixed(3));
  };
  const mk = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e); return e;
  };

  const M = { x: 540, y: 1250, s: 0.72 };
  // falling % signs
  const pcts = [...Array(16)].map(() => {
    const e = mk('text', { 'font-size': 60 + rnd() * 70, fill: rnd() < 0.5 ? '#E9B949' : '#C2473D' }, $('pct'));
    e.textContent = '%';
    return { e, x: rnd() * 1080, y0: rnd() * 2000, sp: 160 + rnd() * 220, rs: (rnd() - 0.5) * 120, op: 0.25 + rnd() * 0.35 };
  });
  const speeds = [...Array(6)].map((_, k) => mk('path', { d: `M0,${-150 + k * 60} h${120 + (k % 3) * 70}` }, $('speed')));
  const dusts = [...Array(7)].map((_, k) => ({ el: mk('circle', {}, $('dust')), a: Math.PI * (0.9 + k * 0.05), d: 80 + k * 22 }));
  const ORB = ['hatBody', 'scarf', 'gloves', 'socks', 'card'].map((id, k) => ({ el: mk('use', { href: '#' + id }, $('orbit')), k }));

  // neon flicker pattern (on/off)
  const flick = t => {
    if (t < 0.3) return 0;
    const pat = [[0.3, 1], [0.38, 0], [0.5, 1], [0.55, 0.2], [0.7, 1], [0.76, 0], [0.86, 1]];
    let v = 0; pat.forEach(([tt, val]) => { if (t >= tt) v = val; });
    return t > 0.86 ? 0.9 + 0.1 * Math.sin(t * 40) : v;
  };

  function render(t) {
    // global shake on "УСПЕЙТЕ"
    const hs = seg(t, 7.9, 8.4);
    const shake = hs > 0 && hs < 1 ? 14 * (1 - hs) : 0;
    $('stage').querySelectorAll(':scope > g:not(#outro)').forEach(() => {});
    const SH = `translate(${(Math.sin(t * 80) * shake).toFixed(1)} ${(Math.cos(t * 63) * shake).toFixed(1)})`;

    pcts.forEach(p => {
      const y = ((p.y0 + p.sp * t) % 2100) - 100;
      set(p.e, `translate(${p.x.toFixed(0)} ${y.toFixed(1)}) rotate(${(p.rs * t).toFixed(1)})`, p.op * seg(t, 3.6, 4.2) * (1 - seg(t, 11.4, 11.8)));
    });

    const nf = flick(t);
    set($('neonSign'), SH, nf);
    set($('skidki'), `${SH} translate(540 640) rotate(-4) scale(${(0.001 + easeOutBack(seg(t, 1.2, 1.5))).toFixed(3)}) translate(-540 -640)`, t > 1.2 ? 0.9 + 0.1 * Math.sin(t * 33) : 0);

    // mascot run-in 1.8–2.8, skid, wink 3.0
    const run = seg(t, 1.8, 2.8);
    const mx = lerp(1500, M.x, easeOutCubic(run));
    const skid = seg(t, 2.6, 3.0);
    let lean = t < 2.6 ? -10 : lerp(-10, 0, easeOutBack(skid));
    if (t > 2.6 && t < 2.8) lean = 12 * Math.sin(Math.PI * seg(t, 2.6, 2.8));
    const hurry = t > 8.0 && t < 11.4;
    const running = (t > 1.8 && t < 2.7) || hurry;
    const legA = running ? Math.sin(t * (hurry ? 34 : 26)) * 28 : 0;
    // jump when excited 4.4–7.4
    const jumping = t > 4.6 && t < 7.4;
    const jump = jumping ? Math.abs(Math.sin(Math.PI * (t - 4.6) / 0.5)) * 70 : 0;
    const bob = running ? Math.abs(Math.sin(t * (hurry ? 34 : 26))) * 18 : 0;
    set($('mascot'), `${SH} translate(${mx.toFixed(1)} ${(M.y - jump - bob).toFixed(1)}) rotate(${lean.toFixed(2)}) scale(${M.s})`, t > 1.8 ? 1 : 0);
    set($('legL'), `rotate(${legA.toFixed(1)} -98 150)`);
    set($('legR'), `rotate(${(-legA).toFixed(1)} 98 150)`);
    const armSwing = running ? Math.sin(t * (hurry ? 34 : 26)) * 25 : (jumping ? -55 + Math.sin(t * 12) * 10 : 0);
    set($('armL'), `rotate(${(-armSwing).toFixed(1)} -296 10)`);
    set($('armR'), `rotate(${armSwing.toFixed(1)} 296 10)`);
    const winkOn = t > 3.0 && t < 3.45;
    set($('eyeR'), undefined, winkOn ? 0 : 1);
    set($('pupilR'), undefined, winkOn ? 0 : 1); set($('hlR'), undefined, winkOn ? 0 : 1);
    set($('wink'), undefined, winkOn ? 1 : 0);
    const excited = (t > 4.4 && t < 7.5) || hurry;
    set($('smile'), undefined, excited ? 0 : 1);
    set($('mouthOpen'), undefined, excited ? 1 : 0);
    const look = hurry ? -18 : 0;
    $('pupils').setAttribute('transform', `translate(${look} ${hurry ? -6 : 0})`);
    set($('sweat'), `translate(0 ${hurry ? ((t * 2) % 1) * 30 : 0})`, hurry ? 1 : 0);
    // lid pops 4.4
    const lp = seg(t, 4.4, 4.9);
    set($('mLid'), `translate(0 ${(-220 * Math.sin(Math.PI * lp)).toFixed(1)}) rotate(${(-14 * Math.sin(Math.PI * lp)).toFixed(1)})`);

    // speed lines + dust
    set($('speed'), `translate(${(mx + 260).toFixed(1)} ${M.y})`, t > 1.8 && t < 2.7 ? 0.8 : 0);
    const dp = seg(t, 2.6, 3.3);
    dusts.forEach((d, k) => {
      d.el.setAttribute('cx', (M.x + 180 + Math.cos(d.a) * -d.d * dp + k * 18).toFixed(1));
      d.el.setAttribute('cy', (M.y + 200 - Math.sin(d.a) * 40 * dp - k * 4).toFixed(1));
      d.el.setAttribute('r', (18 + 26 * dp).toFixed(1));
      d.el.setAttribute('opacity', (dp > 0 && dp < 1 ? 0.7 * (1 - dp) : 0).toFixed(3));
    });

    // tag drops 3.4, swings
    const td = seg(t, 3.4, 3.75), tOut = seg(t, 11.3, 11.6);
    const swing = t > 3.75 ? Math.sin((t - 3.75) * 6) * 16 * Math.exp(-(t - 3.75) * 1.2) : 0;
    set($('tag'), `${SH} translate(540 ${lerp(-300, 860, easeOutCubic(td)).toFixed(1)}) rotate(${swing.toFixed(2)} 0 -190)`, td > 0 ? 1 - tOut : 0);

    // items orbit 4.5–7.5
    const SLOTS = [[165, 1050], [165, 1340], [915, 1050], [915, 1340], [540, 1600]];
    ORB.forEach(o => {
      const p = seg(t, 4.5 + o.k * 0.14, 5.1 + o.k * 0.14), out = seg(t, 7.4, 7.8);
      const [sx, sy] = SLOTS[o.k];
      const pe = easeOutCubic(p);
      const x = lerp(M.x, sx, pe), y = lerp(M.y - 170, sy, pe) - 260 * Math.sin(Math.PI * p) + (p >= 1 ? Math.sin(t * 4 + o.k) * 10 : 0);
      set(o.el, `translate(${x.toFixed(1)} ${(y - 400 * easeInCubic(out)).toFixed(1)}) rotate(${(Math.sin(t * 3 + o.k) * 12).toFixed(1)}) scale(${(0.42 * easeOutBack(p)).toFixed(3)})`, p > 0 ? 1 - out : 0);
    });
    const b5 = seg(t, 6.6, 6.95), b5o = seg(t, 7.6, 7.9);
    set($('badge5'), `translate(860 1620) rotate(12) scale(${(0.001 + easeOutBack(b5)).toFixed(3)})`, b5 > 0 ? 1 - b5o : 0);

    // clock 7.6–11.4
    const cl = seg(t, 7.6, 7.95), clo = seg(t, 11.2, 11.5);
    const ringing = t > 7.95 && t < 11.3;
    const rot = ringing ? Math.sin(t * 50) * 9 : 0;
    set($('clockWrap'), `${SH} translate(${lerp(-200, 200, easeOutBack(cl)).toFixed(1)} 820) rotate(${rot.toFixed(1)}) scale(0.95)`, cl > 0 ? 1 - clo : 0);
    set($('ring'), undefined, ringing && Math.sin(t * 25) > 0 ? 1 : 0);
    $('clockHands').setAttribute('transform', `rotate(${(t * 140) % 360})`);
    const hu = seg(t, 7.9, 8.15), huo = seg(t, 11.2, 11.5);
    set($('hurry'), `${SH} translate(540 1590) scale(${lerp(2.4, 1, easeOutCubic(hu)).toFixed(3)}) translate(-540 -1590)`, hu > 0 ? (1 - huo) * (0.85 + 0.15 * Math.sin(t * 14)) : 0);

    // outro 11.4+
    set($('outroBg'), undefined, easeInOut(seg(t, 11.4, 11.9)));
    const lg = seg(t, 11.8, 12.6);
    set($('logo'), `translate(540 700) scale(${(0.001 + easeOutBack(lg)).toFixed(3)})`, lg > 0 ? 1 : 0);
    const bl = easeOutBack(seg(t, 12.4, 12.9));
    set($('bfLine'), `translate(540 1065) scale(${(0.001 + bl).toFixed(3)}) translate(-540 -1065)`, t > 12.4 ? 1 : 0);
    const ct = easeOutCubic(seg(t, 12.8, 13.3));
    set($('cities'), `translate(0 ${lerp(30, 0, ct)})`, ct);
    const cta = seg(t, 13.2, 13.7);
    const ctaPulse = t > 13.7 ? 1 + 0.03 * Math.sin((t - 13.7) * 5) : 1;
    set($('cta'), `translate(540 1360) scale(${(0.001 + easeOutBack(cta) * ctaPulse).toFixed(3)}) translate(-540 -1360)`, cta > 0 ? 1 : 0);
  }

  window.DURATION = DURATION;
  window.renderAt = render;
  const params = new URLSearchParams(location.search);
  if (params.has('render')) return;
  document.body.classList.add('preview');
  document.fonts.ready.then(() => {
    if (params.has('t')) { render(parseFloat(params.get('t'))); return; }
    let start = null;
    const loop = ts => { if (start === null) start = ts; render(((ts - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
